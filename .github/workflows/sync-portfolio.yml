name: Sync Portfolio project directory

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-portfolio.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: profile-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MirceaStefanescu/MirceaStefanescu' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test safety, preservation and repeatability
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Update only the managed project directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_portfolio.py --apply
