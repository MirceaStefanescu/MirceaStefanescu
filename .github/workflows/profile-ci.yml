name: Profile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Profile checks
    if: github.repository == 'MirceaStefanescu/MirceaStefanescu' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout the verified shared presentation checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MirceaStefanescu/Portfolio
          ref: b70af4a7de4399433ae854ae115f510ab628184e
          path: .portfolio-checks
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check-presentation.py
            /tests/test-presentation.py
      - name: Test sync boundaries and profile links
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 .portfolio-checks/tests/test-presentation.py
      - name: Check presentation links and images
        run: python3 scripts/check_profile.py --external
      - name: Install verified actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${RUNNER_TEMP}/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color .github/workflows/*.yml
      - name: Review introduced dependency vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  codeql:
    name: CodeQL (Python)
    if: github.repository == 'MirceaStefanescu/MirceaStefanescu' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: /language:python

  status:
    name: Profile status
    needs: [quality, codeql]
    if: always() && github.repository == 'MirceaStefanescu/MirceaStefanescu' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every profile check to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$CODEQL_RESULT" = success
